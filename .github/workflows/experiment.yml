name: Run noise experiment

# Feeds random noise to an AI as a task, saves the run under results/,
# rebuilds the showcase (docs/ and the README table) and commits it to main.
#
# provider "ollama" runs an open-source model with Ollama on the runner's CPU:
# free, no secrets needed, but slow (small models only, a few minutes per task).
# provider "claude" needs a repository secret named ANTHROPIC_API_KEY.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which AI (ollama = open-source model on the runner, free)
        type: choice
        options: [ollama, claude]
        default: ollama
      model:
        description: "Model id. Blank = llama3.2:3b for ollama, claude-opus-5-5 for claude. Any Ollama library tag works (qwen3:4b, gemma3:4b, phi4-mini...)"
        type: string
        default: ""
      task:
        description: What to ask the AI to make
        type: choice
        options: [all, code, text, image]
        default: all
      strategy:
        description: How to make the noise
        type: choice
        options: [random, chars, unicode, syllables, word_salad, keysmash, base64, mixed]
        default: random
      count:
        description: How many experiments (fresh noise each)
        type: number
        default: 1
      effort:
        description: Effort level (claude only)
        type: choice
        options: [low, medium, high, xhigh, max]
        default: medium
  # Uncomment to run one experiment of each task every day at 09:00 UTC.
  # schedule:
  #   - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: noise-experiment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Start Ollama and pull the model
        if: ${{ (inputs.provider || 'ollama') == 'ollama' }}
        env:
          MODEL: ${{ inputs.model || 'llama3.2:3b' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/ >/dev/null; then
            nohup ollama serve >/tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 30); do curl -sf http://localhost:11434/ >/dev/null && break; sleep 1; done
          ollama pull "$MODEL"
      - name: Run experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'ollama' }}
          MODEL: ${{ inputs.model }}
          TASK: ${{ inputs.task || 'all' }}
          STRATEGY: ${{ inputs.strategy || 'random' }}
          COUNT: ${{ inputs.count || 1 }}
          EFFORT: ${{ inputs.effort || 'medium' }}
        run: |
          args=(--task "$TASK" --strategy "$STRATEGY" --count "$COUNT")
          if [ "$PROVIDER" = "claude" ]; then
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::Add an ANTHROPIC_API_KEY repository secret to run Claude experiments."
              exit 1
            fi
            args+=(--provider claude --effort "$EFFORT")
            if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          else
            args+=(--provider local --base-url http://localhost:11434/v1 --model "${MODEL:-llama3.2:3b}")
          fi
          ainoise run "${args[@]}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs README.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add noise experiment results ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:main
